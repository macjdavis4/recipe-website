# Production on the Droplet: just the app container. Lives in /opt/larder next
# to .env (written by the deploy workflow from the PRODUCTION_ENV secret).
#
# - HTTPS and the public ports belong to the host's nginx (deploy/nginx/).
# - The database is DigitalOcean Managed PostgreSQL (DATABASE_URL in .env),
#   which also handles daily backups.
# - The app listens only on 127.0.0.1:3000, so nothing but nginx on this
#   machine can reach it. Docker bypasses ufw for published ports, which is
#   why the loopback binding matters.
name: larder

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/macjdavis4/recipe-website}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
