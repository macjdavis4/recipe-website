# Runs the production compose file locally against a database on your machine,
# for checking the image, healthcheck, and migrations before a deploy:
#
#   docker build -f deploy/Dockerfile -t larder-app:local .
#   cd deploy && cp ../.env .env   # then set DATABASE_URL host to host.docker.internal
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up -d
#   curl http://127.0.0.1:3000/api/health
services:
  app:
    image: larder-app:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
